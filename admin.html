<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | HarshPromptHub</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #08080d;
            color: white;
            min-height: 100vh;
        }

        .container {
            width: min(900px, 92%);
            margin: auto;
            padding: 50px 0;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 35px;
        }

        .logo span {
            opacity: .5;
        }

        .box {
            background: #101019;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            color: #ccc;
            font-size: 14px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 14px;

            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.12);

            background: #08080d;
            color: white;

            outline: none;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        input[type="file"] {
            padding: 12px;
        }

        button {
            margin-top: 20px;

            padding: 13px 22px;

            border: none;
            border-radius: 11px;

            background: linear-gradient(135deg,#7c3cff,#ff2f92);

            color: white;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        .logout {
            background: #22222c;
            margin-left: 8px;
        }

        .message {
            margin-top: 15px;
            color: #aaa;
        }

        #adminPanel {
            display: none;
        }

        .preview {
            max-width: 250px;
            margin-top: 15px;
            border-radius: 15px;
            display: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="logo">
        Harsh<span>PromptHub</span>
    </div>


    <!-- LOGIN -->

    <div class="box" id="loginBox">

        <h2>🔐 Admin Login</h2>

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Admin email"
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Password"
        >


        <button id="loginBtn">
            Login
        </button>


        <p class="message" id="loginMessage"></p>

    </div>



    <!-- ADMIN PANEL -->

    <div id="adminPanel">

        <div class="box">

            <h2>➕ Add New Prompt</h2>
<hr>

<section class="manage-prompts">

    <h2>Manage Prompts</h2>

    <div id="adminPrompts">
        Loading prompts...
    </div>

</section>

            <label>Prompt Title</label>

            <input
                type="text"
                id="title"
                placeholder="Example: 15 August Cinematic Portrait"
            >


            <label>Category</label>

            <select id="category">

                <label>Gender</label>

<select id="gender">

    <option value="Boy">
        👦 Boy
    </option>

    <option value="Girl">
        👧 Girl
    </option>

</select>

                <option value="Independence Day">
                    Independence Day
                </option>

                <option value="Diwali">
                    Diwali
                </option>

                <option value="Holi">
                    Holi
                </option>

                <option value="Christmas">
                    Christmas
                </option>

                <option value="Trending">
                    Trending
                </option>

                <option value="Cinematic">
                    Cinematic
                </option>

            </select>


            <label>Description</label>

            <input
                type="text"
                id="description"
                placeholder="Short description"
            >


            <label>Sample Photo</label>

            <input
                type="file"
                id="image"
                accept="image/*"
            >

            <img
                id="preview"
                class="preview"
            >


            <label>AI Prompt</label>

            <textarea
                id="prompt"
                placeholder="Paste your complete AI prompt here..."
            ></textarea>


            <label>
                <input
                    type="checkbox"
                    id="featured"
                    style="width:auto;"
                >
                Featured / Trending
            </label>


            <button id="publishBtn">
                🚀 Publish Prompt
            </button>

            <button
                class="logout"
                id="logoutBtn"
            >
                Logout
            </button>


            <p
                class="message"
                id="publishMessage"
            ></p>

        </div>

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Back to HarshPromptHub
    </a>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    /* ==============================
       SUPABASE CONNECTION
       ============================== */

    const SUPABASE_URL =
        "https://qtnjiyijgtsjfwqguynx.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_DImSiDCiNzPuXO8c54DPVg_uQFzbzAX";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );



    /* ==============================
       ELEMENTS
       ============================== */

    const loginBox =
        document.getElementById("loginBox");

    const adminPanel =
        document.getElementById("adminPanel");

    const loginBtn =
        document.getElementById("loginBtn");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const loginMessage =
        document.getElementById("loginMessage");

    const publishMessage =
        document.getElementById("publishMessage");

    const imageInput =
        document.getElementById("image");

    const preview =
        document.getElementById("preview");



    /* ==============================
       IMAGE PREVIEW
       ============================== */

    imageInput.addEventListener(
        "change",
        function () {

            const file = this.files[0];

            if (!file) return;

            preview.src =
                URL.createObjectURL(file);

            preview.style.display =
                "block";
        }
    );



    /* ==============================
       LOGIN
       ============================== */

    loginBtn.addEventListener(
        "click",
        async function () {

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;


            loginMessage.innerText =
                "Logging in...";


            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                loginMessage.innerText =
                    "❌ " + error.message;

                return;
            }


            loginMessage.innerText =
                "";


            loginBox.style.display =
                "none";

            adminPanel.style.display =
                "block";
            
            loadAdminPrompts();
        }
    );



    /* ==============================
       LOGOUT
       ============================== */

    logoutBtn.addEventListener(
        "click",
        async function () {

            await supabaseClient.auth.signOut();

            adminPanel.style.display =
                "none";

            loginBox.style.display =
                "block";
        }
    );

/* ==============================
   MANAGE PROMPTS
   ============================== */

async function loadAdminPrompts() {

    const container =
        document.getElementById("adminPrompts");

    container.innerHTML =
        "Loading prompts...";


    const { data, error } =
        await supabaseClient
            .from("prompts")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        container.innerHTML =
            "❌ " + error.message;

        console.error(error);

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            "No prompts found.";

        return;
    }


    container.innerHTML = "";


    data.forEach(prompt => {

        const item =
            document.createElement("div");

        item.style.cssText = `
            padding:15px;
            margin-top:12px;
            border:1px solid rgba(255,255,255,.1);
            border-radius:12px;
            background:#08080d;
        `;


        item.innerHTML = `

    <strong>
        ${prompt.title || "Untitled"}
    </strong>

    <div style="
        color:#999;
        font-size:13px;
        margin-top:6px;
    ">
        ${prompt.category || "No category"}
    </div>

    <div style="
        color:#777;
        font-size:12px;
        margin-top:5px;
    ">
        ${prompt.featured ? "⭐ Featured" : ""}
    </div>

    <button
        onclick="editPrompt('${prompt.id}')"
        style="margin-right:8px;"
    >
        ✏️ Edit
    </button>

    <button
        onclick="deletePrompt('${prompt.id}')"
        style="background:#7d2020;"
    >
        🗑️ Delete
    </button>

`;


        container.appendChild(item);

    });

    }
    async function editPrompt(id) {

    const { data, error } =
        await supabaseClient
            .from("prompts")
            .select("*")
            .eq("id", id)
            .single();

    if (error) {
        alert("❌ Prompt load nahi hua: " + error.message);
        return;
    }

    document.getElementById("title").value =
        data.title || "";

    document.getElementById("category").value =
        data.category || "";

    document.getElementById("description").value =
        data.description || "";

    document.getElementById("prompt").value =
        data.prompt || "";

    document.getElementById("featured").checked =
        data.featured === true;

    if (data.image_url) {
        preview.src = data.image_url;
        preview.style.display = "block";
    }

    document.getElementById("publishMessage").innerText =
        "✏️ Editing: " + (data.title || "Prompt");

    window.editingPromptId = id;

    document.getElementById("publishBtn").innerText =
        "💾 Update Prompt";

    document
        .getElementById("title")
        .scrollIntoView({
            behavior: "smooth"
        });
    }
    async function deletePrompt(id) {

    const confirmDelete =
        confirm(
            "⚠️ Kya tum is prompt ko permanently delete karna chahte ho?"
        );

    if (!confirmDelete) {
        return;
    }

    const { error } =
        await supabaseClient
            .from("prompts")
            .delete()
            .eq("id", id);

    if (error) {

        alert(
            "❌ Delete error: " +
            error.message
        );

        return;
    }

    alert(
        "✅ Prompt successfully deleted!"
    );

    loadAdminPrompts();
    }

    /* ==============================
       PUBLISH PROMPT
       ============================== */

    document.getElementById("publishBtn")
        .addEventListener(
            "click",
            async function () {

                if (window.editingPromptId) {

    const id =
        window.editingPromptId;

    const title =
        document.getElementById("title").value.trim();

    const category =
        document.getElementById("category").value;

    const description =
        document.getElementById("description").value.trim();

    const prompt =
        document.getElementById("prompt").value.trim();

    const featured =
        document.getElementById("featured").checked;

                    if (!title || !prompt) {

    publishMessage.innerText =
        "⚠️ Title aur prompt zaroori hain.";

    return;
    }


    publishMessage.innerText =
        "Updating...";


    const { error } =
        await supabaseClient
            .from("prompts")
            .update({
                title: title,
                category: category,
                description: description,
                prompt: prompt,
                featured: featured
            })
            .eq("id", id);


    if (error) {

        publishMessage.innerText =
            "❌ Update error: " +
            error.message;

        return;
    }


    publishMessage.innerText =
        "✅ Prompt successfully updated!";


    window.editingPromptId = null;

    document.getElementById("publishBtn").innerText =
        "🚀 Publish Prompt";


    loadAdminPrompts();

    return;
    }

                const title =
                    document.getElementById("title").value.trim();

                const category =
                    document.getElementById("category").value;

                const description =
                    document.getElementById("description").value.trim();

                const prompt =
                    document.getElementById("prompt").value.trim();

                const featured =
                    document.getElementById("featured").checked;

                const imageFile =
                    imageInput.files[0];


                if (
                    !title ||
                    !prompt ||
                    !imageFile
                ) {

                    publishMessage.innerText =
                        "⚠️ Title, photo aur prompt zaroori hain.";

                    return;
                }


                publishMessage.innerText =
                    "Uploading...";


                /* IMAGE NAME */

                const fileName =
                    Date.now() +
                    "-" +
                    imageFile.name.replace(
                        /[^a-zA-Z0-9.-]/g,
                        "-"
                    );


                /* UPLOAD IMAGE */

                const { error: uploadError } =
                    await supabaseClient.storage
                        .from("prompt-images")
                        .upload(
                            fileName,
                            imageFile
                        );

                if (uploadError) {

                    publishMessage.innerText =
                        "❌ Image upload error: " +
                        uploadError.message;

                    return;
                }


                /* IMAGE URL */

                const { data: imageData } =
                    supabaseClient.storage
                        .from("prompt-images")
                        .getPublicUrl(fileName);


                const imageUrl =
                    imageData.publicUrl;


                /* SAVE PROMPT */

                const { error: insertError } =
                    await supabaseClient
                        .from("prompts")
                        .insert({

                            title: title,

                            category: category,

                            description: description,

                            prompt: prompt,

                            image_url: imageUrl,

                            featured: featured

                        });


                if (insertError) {

                    publishMessage.innerText =
                        "❌ Database error: " +
                        insertError.message;

                    return;
                }


                publishMessage.innerText =
                    "✅ Prompt successfully published!";


                /* CLEAR FORM */

                document.getElementById("title").value = "";

                document.getElementById("description").value = "";

                document.getElementById("prompt").value = "";

                document.getElementById("featured").checked = false;

                imageInput.value = "";

                preview.style.display = "none";

            }
        );

</script>

</body>
</html>
