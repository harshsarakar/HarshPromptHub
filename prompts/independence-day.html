<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>15 August AI Photo Prompt | HarshPromptHub</title>

    <meta name="description"
        content="Create a cinematic 15 August Independence Day AI photo with this ready-to-use AI prompt.">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #08080d;
            color: white;
            line-height: 1.6;
        }

        /* NAVBAR */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 7%;

            background: rgba(8, 8, 13, 0.94);
            backdrop-filter: blur(12px);

            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 21px;
            font-weight: 800;
        }

        .logo span {
            opacity: 0.55;
        }

        .back-btn {
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
        }

        .back-btn:hover {
            color: white;
        }


        /* MAIN */

        .page {
            max-width: 900px;
            margin: auto;
            padding: 70px 20px;
        }

        .category {
            display: inline-block;

            padding: 6px 12px;

            border-radius: 20px;

            background: rgba(124,60,255,0.15);
            color: #b99cff;

            font-size: 12px;
            font-weight: bold;
        }

        h1 {
            margin-top: 18px;

            font-size: clamp(38px, 7vw, 65px);
            line-height: 1.08;
        }

        .intro {
            margin-top: 18px;

            color: #999;
            font-size: 17px;

            max-width: 700px;
        }


        /* PREVIEW */

        .preview {
            min-height: 380px;

            margin-top: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 24px;

            border: 1px solid rgba(255,255,255,0.1);

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(124,60,255,0.25),
                    transparent 45%
                ),
                linear-gradient(
                    135deg,
                    #11111a,
                    #151522
                );
        }

        .preview-content {
            text-align: center;
            padding: 30px;
        }

        .flag {
            font-size: 90px;
        }

        .preview-content h2 {
            margin-top: 15px;
            font-size: 28px;
        }

        .preview-content p {
            color: #999;
        }


        /* PROMPT */

        .prompt-section {
            margin-top: 45px;
        }

        .prompt-section h2 {
            margin-bottom: 15px;
            font-size: 28px;
        }

        .prompt-box {
            padding: 24px;

            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;

            background: #101019;

            color: #ccc;

            font-size: 15px;
        }

        .copy-btn {
            margin-top: 15px;

            padding: 13px 22px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #7c3cff,
                #ff2f92
            );

            color: white;

            font-weight: bold;
            font-size: 14px;

            cursor: pointer;
        }

        .copy-btn:hover {
            opacity: 0.9;
        }


        /* TIPS */

        .tips {
            margin-top: 45px;

            padding: 25px;

            border-radius: 18px;

            background: #101019;

            border: 1px solid rgba(255,255,255,0.1);
        }

        .tips h2 {
            margin-bottom: 12px;
        }

        .tips p {
            color: #999;
        }


        /* RELATED */

        .related {
            margin-top: 55px;
        }

        .related h2 {
            margin-bottom: 20px;
        }

        .related-grid {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 18px;
        }

        .related-card {
            padding: 22px;

            border-radius: 18px;

            background: #101019;

            border: 1px solid rgba(255,255,255,0.1);
        }

        .related-card span {
            font-size: 30px;
        }

        .related-card h3 {
            margin-top: 10px;
        }

        .related-card p {
            margin-top: 6px;

            color: #888;

            font-size: 14px;
        }


        /* FOOTER */

        .footer {
            padding: 50px 20px 25px;

            text-align: center;

            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .footer p {
            color: #777;
        }

        .copyright {
            margin-top: 20px;

            font-size: 13px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .navbar {
                padding: 16px 20px;
            }

            .page {
                padding: 50px 18px;
            }

            .preview {
                min-height: 300px;
            }

            .related-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 42px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="../index.html" class="logo">
            Harsh<span>PromptHub</span>
        </a>

        <a href="../index.html" class="back-btn">
            ← Back to Home
        </a>

    </header>



    <!-- MAIN CONTENT -->

    <main class="page">


        <!-- RELATED PROMPTS -->

        <section class="related">

            <h2>
                🔥 More 15 August Prompts
            </h2>

<div class="related-grid">
    
            </div>

        </section>


    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <h2>
            HarshPromptHub
        </h2>

        <p>
            Creative AI photo prompts for every occasion.
        </p>

        <p class="copyright">
            © 2026 HarshPromptHub. All rights reserved.
        </p>

    </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://qtnjiyijgtsjfwqguynx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DImSiDCiNzPuXO8c54DPVg_uQFzbzAX";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

async function loadIndependencePrompts() {

    const grid =
        document.querySelector(".related-grid");

    if (!grid) return;

    const { data, error } =
        await supabaseClient
            .from("prompts")
            .select("*")
            .eq("category", "Independence Day")
            .order("created_at", {
                ascending: false
            });

    if (error) {

        console.error(
            "Collection loading error:",
            error
        );

        return;
    }

    grid.innerHTML = "";

    data.forEach(prompt => {

        const card =
            document.createElement("a");

        card.className =
            "related-card";

        card.href =
            "../prompt.html?id=" + prompt.id;

        card.style.textDecoration = "none";
        card.style.color = "inherit";

        card.innerHTML = `

            <img
                src="${prompt.image_url || ""}"
                alt="${prompt.title}"
                style="
                    width:100%;
                    height:220px;
                    object-fit:contain;
                    border-radius:14px;
                    margin-bottom:15px;
                    background:#08080d;
                "
            >

            <span>🇮🇳</span>

            <h3>
                ${prompt.title}
            </h3>

            <p>
                ${prompt.description || ""}
            </p>

            <div style="
                margin-top:15px;
                color:#b99cff;
                font-weight:bold;
            ">
                View Prompt →
            </div>

        `;

        grid.appendChild(card);

    });

}

loadIndependencePrompts();

</script>

    <!-- COPY PROMPT -->

    <script>

        const copyBtn = document.getElementById("copyBtn");

        const promptText = document.getElementById("promptText");


        copyBtn.addEventListener("click", async () => {

            const text = promptText.innerText.trim();

            try {

                await navigator.clipboard.writeText(text);

                copyBtn.innerText = "✅ Prompt Copied!";

                setTimeout(() => {

                    copyBtn.innerText = "📋 Copy Prompt";

                }, 2000);

            }

            catch (error) {

                copyBtn.innerText = "❌ Copy Failed";

                setTimeout(() => {

                    copyBtn.innerText = "📋 Copy Prompt";

                }, 2000);

            }

        });

    </script>


</body>

    </html>
