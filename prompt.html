<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Prompt | HarshPromptHub</title>

    <meta name="description"
        content="Explore AI photo prompts on HarshPromptHub.">

    <link rel="stylesheet" href="style.css">

    <style>
        .prompt-page {
            max-width: 900px;
            margin: auto;
            padding: 70px 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #aaa;
            text-decoration: none;
        }

        .detail-image {
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            display: block;
            margin-top: 30px;
            border-radius: 22px;
            background: #151522;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .detail-category {
            display: inline-block;
            margin-top: 30px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(124,60,255,0.15);
            color: #b99cff;
            font-size: 12px;
            font-weight: bold;
        }

        .prompt-page h1 {
            margin-top: 15px;
            font-size: clamp(35px, 7vw, 60px);
            line-height: 1.1;
        }

        .detail-description {
            margin-top: 15px;
            color: #999;
            font-size: 17px;
        }

        .full-prompt {
            margin-top: 40px;
        }

        .full-prompt h2 {
            margin-bottom: 15px;
        }

        .prompt-text {
            padding: 22px;
            border-radius: 18px;
            background: #101019;
            border: 1px solid rgba(255,255,255,0.1);
            color: #ccc;
            white-space: pre-wrap;
            line-height: 1.7;
        }

        .copy-prompt {
            margin-top: 15px;
            padding: 13px 22px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3cff, #ff2f92);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .loading {
            color: #999;
            text-align: center;
            padding: 80px 20px;
        }

        .error {
            color: #ff7777;
            text-align: center;
            padding: 80px 20px;
        }
    </style>
</head>

    <header class="navbar">

        <a href="index.html" class="logo">
            Harsh<span>PromptHub</span>
        </a>

        <a href="index.html" class="back-link">
            ← Back
        </a>

    </header>


    <main class="prompt-page">

        <div id="loading" class="loading">
            Loading prompt...
        </div>

        <div id="promptContent" style="display:none;">

            <img
                id="promptImage"
                class="detail-image"
                alt=""
            >

            <span
                id="promptCategory"
                class="detail-category">
            </span>

            <h1 id="promptTitle"></h1>

            <p
                id="promptDescription"
                class="detail-description">
            </p>


            <section class="full-prompt">

                <h2>
                    AI Prompt
                </h2>

                <div
                    id="promptText"
                    class="prompt-text">
                </div>

                <button
                    id="copyPrompt"
                    class="copy-prompt">
                    📋 Copy Prompt
                </button>

            </section>

        </div>


        <div
            id="error"
            class="error"
            style="display:none;">
        </div>

    </main>
